# Yazi file manager configuration
# Full reference: https://yazi-rs.github.io/docs/configuration/yazi

[manager]
ratio = [1, 4, 3]  # parent:current:preview ratio
sort_by = "natural"
sort_sensitive = false
sort_reverse = false
sort_dir_first = true
show_hidden = false
show_symlink = true

[preview]
tab_size = 2
max_width = 600
max_height = 900

[opener]
edit = [
  { run = '${EDITOR:-vi} "$@"', block = true, for = "unix" },
]
open = [
  { run = 'xdg-open "$@"', for = "linux" },
]

[open]
rules = [
  { mime = "text/*", use = "edit" },
  { mime = "application/json", use = "edit" },
  { mime = "application/x-yaml", use = "edit" },
  { mime = "application/toml", use = "edit" },
  { name = "*.md", use = "edit" },
  { name = "*.sh", use = "edit" },
  { name = "*.go", use = "edit" },
  { name = "*.lua", use = "edit" },
  { name = "*.py", use = "edit" },
  { name = "*.rs", use = "edit" },
  { name = "*.ts", use = "edit" },
  { name = "*.js", use = "edit" },
  { mime = "*", use = "open" },
]
